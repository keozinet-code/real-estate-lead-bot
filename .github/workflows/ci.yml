name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: primehomes_test
          POSTGRES_USER: primehomes
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U primehomes -d primehomes_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://primehomes:test-password@localhost:5432/primehomes_test
      N8N_ENABLED: "false"
      AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall -q app tests alembic
      - run: alembic upgrade head
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow exports
        run: find n8n/workflows -name '*.json' -print0 | xargs -0 -n1 jq empty
      - name: Validate production Compose
        env:
          DOMAIN: leads.example.test
          POSTGRES_DB: primehomes
          POSTGRES_USER: primehomes
          POSTGRES_PASSWORD: test-password
          N8N_IMAGE: n8nio/n8n:latest
          TLS_CERT_PATH: /tmp/fullchain.pem
          TLS_KEY_PATH: /tmp/privkey.pem
        run: |
          cp .env.production.example .env.production
          docker compose -f docker-compose.prod.yml config --quiet
