services:
  postgres:
    image: postgres:17
    container_name: primehomes-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-primehomes}
      POSTGRES_USER: ${POSTGRES_USER:-primehomes_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-primehomes_dev_password}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-primehomes_app} -d ${POSTGRES_DB:-primehomes}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data: